[project]
name = "clutchbot"
version = "1.0.3"
description = "Twitter bot that posts osu! tournament match results"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Taldux" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "oauthlib>=3.3.1",
    "playwright>=1.63.0",
    "prometheus-client>=0.26.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "tenacity>=9.1.4",
    "typer>=0.27.2",
]

[project.scripts]
clutchbot = "clutchbot.cli:app"

[build-system]
requires = ["uv_build>=0.9.5,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # import sorting
    "UP",      # pyupgrade
    "B",       # bugbear
    "SIM",     # simplify
    "N",       # naming
    "RUF",     # ruff-specific
    "ASYNC",   # async pitfalls
    "PTH",     # prefer pathlib
    "LOG",     # logging misuse
    "G",       # logging format strings
]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pdoc>=16.0.0",
    "pillow>=12.3.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "ruff>=0.16.8",
    "types-oauthlib>=3.3.0.20260724",
]
