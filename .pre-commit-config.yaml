# Install once with: uv run pre-commit install
# Run on everything with: uv run pre-commit run --all-files

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types_or: [python, pyi]
      - id: mypy
        name: mypy
        entry: uv run mypy src
        language: system
        types_or: [python, pyi]
        pass_filenames: false
      # Whole test suite
      - id: pytest
        name: pytest
        entry: uv run pytest -q
        language: system
        files: ^(src|tests)/|^pyproject\.toml$
        pass_filenames: false
